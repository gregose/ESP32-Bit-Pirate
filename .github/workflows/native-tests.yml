name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Run native tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade platformio
          pio --version

      - name: Run PlatformIO native tests
        run: pio test -e native-tests

      - name: Check T-Beam Supreme board-specific defaults and power policy
        run: |
          for FREQUENCY in 868.0f 915.0f; do
            g++ -std=c++17 -DTBEAM_TEST_STANDALONE \
              -DLORA_DEFAULT_FREQUENCY="${FREQUENCY}" \
              -Isrc -Itest -Itest/Boards/fakes \
              -I.pio/libdeps/native-tests/Unity/src \
              test/Boards/test_TBeamSupreme.cpp \
              .pio/libdeps/native-tests/Unity/src/unity.c \
              -o "${RUNNER_TEMP}/tbeam-native-tests"
            "${RUNNER_TEMP}/tbeam-native-tests"
          done

      - name: Check T-Beam OLED layout, failures and independent transport
        run: |
          g++ -std=c++17 -DTBEAM_OLED_TEST \
            -Itest/Boards/oled_fakes -Itest/Boards/fakes -Isrc \
            -I.pio/libdeps/native-tests/Unity/src \
            test/Boards/test_TBeamOled.cpp \
            .pio/libdeps/native-tests/Unity/src/unity.c \
            -o "${RUNNER_TEMP}/tbeam-oled-tests"
          "${RUNNER_TEMP}/tbeam-oled-tests"
